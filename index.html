<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elizabeth y David · Comparte tu foto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --surface:#FFFFFF;
    --ink:#2A241D;
    --muted:#8A7F6E;
    --gold:#A9834F;
    --gold-soft:#E4D6BC;
    --border:#E9E1D2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:env(safe-area-inset-top,24px) 20px env(safe-area-inset-bottom,24px);
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:44px 32px;
    text-align:center;
  }
  .screen{display:none;}
  .screen.active{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rule{width:36px;height:1px;background:var(--gold);margin:0 auto 22px;}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:2.3rem;
    line-height:1.15;
    margin-bottom:10px;
  }
  .date{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:var(--muted);
    font-size:1.05rem;
    margin-bottom:28px;
  }
  p.copy{
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.6;
    margin-bottom:32px;
  }
  .btn{
    display:inline-block;
    width:100%;
    background:var(--ink);
    color:var(--bg);
    border:none;
    padding:16px 20px;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:.02em;
    cursor:pointer;
    text-decoration:none;
  }
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-ghost{
    background:none;
    color:var(--muted);
    border:1px solid var(--border);
    margin-top:12px;
  }
  .preview-frame{
    border:1px solid var(--border);
    padding:8px;
    margin-bottom:20px;
  }
  .preview-frame img{
    display:block;
    width:100%;
    max-height:340px;
    object-fit:cover;
  }
  textarea{
    width:100%;
    border:1px solid var(--border);
    background:var(--bg);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:14px;
    resize:none;
    height:78px;
    margin-bottom:16px;
  }
  textarea:focus{outline:1px solid var(--gold);}
  .icon{
    width:46px;height:46px;
    margin:0 auto 20px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    font-family:'Cormorant Garamond',serif;
    font-size:1.6rem;
  }
  .progress{display:none;margin-bottom:16px;text-align:left;}
  .progress.active{display:block;}
  .progress-track{height:4px;background:var(--gold-soft);overflow:hidden;}
  .progress-bar{height:100%;width:0%;background:var(--gold);transition:width .2s ease;}
  .progress-bar.indeterminate{width:40%;animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-40%;}100%{margin-left:100%;}}
  .progress-text{font-size:0.82rem;color:var(--muted);margin-top:10px;line-height:1.5;}
  .error{display:none;color:#9A3B2E;font-size:0.85rem;margin-bottom:14px;line-height:1.5;}
  .error.active{display:block;}
  .preview-frame.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:340px;overflow:auto;}
  .preview-frame.grid img{aspect-ratio:1;max-height:none;height:100%;}
  .count{font-size:0.85rem;color:var(--muted);margin-bottom:14px;line-height:1.5;}
</style>
</head>
<body>

<div class="card">

  <!-- Pantalla 1: bienvenida -->
  <div class="screen active" id="welcome">
    <div class="rule"></div>
    <h1>Elizabeth y David</h1>
    <div class="date">21 de noviembre, 2026</div>
    <p class="copy">Ayúdanos a guardar los momentos que nosotros no alcanzamos a ver. Toma una foto y compártela con nosotros.</p>
    <label class="btn" for="cameraInput">Tomar foto</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <label class="btn btn-ghost" for="galleryInput">Elegir de mi galería</label>
    <input type="file" id="galleryInput" accept="image/*" multiple hidden>
  </div>

  <!-- Pantalla 2: previsualización + mensaje -->
  <div class="screen" id="preview">
    <div class="preview-frame" id="previewFrame"></div>
    <div class="count" id="previewCount"></div>
    <textarea id="messageInput" placeholder="Deja un mensaje para los novios (opcional)"></textarea>
    <div class="progress" id="progress">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div class="error" id="errorMsg"></div>
    <button class="btn" id="sendBtn">Enviar foto</button>
    <button class="btn btn-ghost" id="retakeBtn">Volver</button>
  </div>

  <!-- Pantalla 3: agradecimiento -->
  <div class="screen" id="thanks">
    <div class="icon">✓</div>
    <h1 style="font-size:1.9rem;">Gracias</h1>
    <p class="copy" id="thanksCopy">Tu foto ya es parte de nuestra historia.</p>
    <button class="btn" id="anotherBtn">Subir más fotos</button>
  </div>

</div>

<script>
  // URL del Web App de Google Apps Script
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLpcAdgrc1Kammwv3W5F7lkmdFsdZtvQaz9CBwJ8zUt9qgFHVF86xkAOz-KxhC8QVIVg/exec";
  const MAX_PHOTOS = 10; // máximo de fotos por envío

  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  const previewFrame = document.getElementById('previewFrame');
  const previewCount = document.getElementById('previewCount');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const errorMsg = document.getElementById('errorMsg');
  const thanksCopy = document.getElementById('thanksCopy');

  let queue = [];        // fotos pendientes por enviar
  let sentCount = 0;     // fotos ya enviadas en este lote
  let uploading = false;
  let objectUrls = [];

  window.addEventListener('beforeunload', (e) => {
    if (uploading) { e.preventDefault(); e.returnValue = ''; }
  });

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  const MAX_SIDE = 6000;                            // ~24 MP (6000 x 4000)
  const MAX_PIXELS = IS_IOS ? 16777216 : 24000000;  // iOS limita el canvas a ~16.7 MP
  const ORIGINAL_MAX_BYTES = 12 * 1024 * 1024;      // JPEG de hasta 12 MB se envía tal cual

  function readAsDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function compressImage(file){
    return readAsDataURL(file).then((src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(
          1,
          MAX_SIDE / Math.max(img.width, img.height),
          Math.sqrt(MAX_PIXELS / (img.width * img.height))
        );
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = src;
    }));
  }

  // Si es JPEG de tamaño razonable se manda el original (calidad 100%); si no, se reduce a ~24 MP
  function prepareImage(file){
    if (file.type === 'image/jpeg' && file.size <= ORIGINAL_MAX_BYTES) return readAsDataURL(file);
    return compressImage(file);
  }

  function sendLabel(){
    return queue.length > 1 ? 'Enviar ' + queue.length + ' fotos' : 'Enviar foto';
  }

  function renderPreview(){
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls = [];
    previewFrame.innerHTML = '';
    previewFrame.classList.toggle('grid', queue.length > 1);
    queue.forEach(f => {
      const url = URL.createObjectURL(f);
      objectUrls.push(url);
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Foto seleccionada';
      previewFrame.appendChild(img);
    });
    previewCount.textContent = queue.length > 1 ? queue.length + ' fotos seleccionadas' : '';
    sendBtn.textContent = sendLabel();
  }

  function handleFiles(e){
    let files = Array.from(e.target.files || []);
    if (!files.length) return;
    const capped = files.length > MAX_PHOTOS;
    if (capped) files = files.slice(0, MAX_PHOTOS);
    errorMsg.classList.remove('active');
    queue = files;
    sentCount = 0;
    renderPreview();
    if (capped) previewCount.textContent = 'Se pueden enviar ' + MAX_PHOTOS + ' fotos a la vez. Después puedes subir más.';
    showScreen('preview');
  }
  cameraInput.addEventListener('change', handleFiles);
  galleryInput.addEventListener('change', handleFiles);

  function resetAll(){
    queue = [];
    sentCount = 0;
    cameraInput.value = '';
    galleryInput.value = '';
    messageInput.value = '';
    errorMsg.classList.remove('active');
    renderPreview();
  }

  retakeBtn.addEventListener('click', () => { resetAll(); showScreen('welcome'); });
  document.getElementById('anotherBtn').addEventListener('click', () => { resetAll(); showScreen('welcome'); });

  function setUploading(on){
    uploading = on;
    sendBtn.disabled = on;
    retakeBtn.disabled = on;
    messageInput.disabled = on;
    sendBtn.textContent = on ? 'Enviando...' : sendLabel();
    progress.classList.toggle('active', on);
    if (on) {
      errorMsg.classList.remove('active');
      progressBar.style.width = '0%';
    }
  }

  // Envía una foto. La barra es estimada: Apps Script no permite medir el avance real.
  async function sendOne(file, message, onProgress){
    const dataUrl = await prepareImage(file);
    let pct = 4;
    onProgress(pct);
    const timer = setInterval(() => {
      pct += (92 - pct) * 0.04;
      onProgress(pct);
    }, 300);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 180000);
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ image: dataUrl, message: message }),
        signal: controller.signal
      });
    } finally {
      clearInterval(timer);
      clearTimeout(timeout);
    }
    onProgress(100);
  }

  sendBtn.addEventListener('click', async () => {
    if (!queue.length) return;
    const message = messageInput.value.trim();
    const total = queue.length + sentCount;
    setUploading(true);
    try {
      while (queue.length) {
        const slice = 100 / total;
        const base = sentCount * slice;
        progressText.textContent = total > 1
          ? 'Subiendo foto ' + (sentCount + 1) + ' de ' + total + '... por favor no cierres esta página.'
          : 'Subiendo tu foto... por favor no cierres esta página.';
        await sendOne(queue[0], message, (p) => {
          progressBar.style.width = (base + slice * p / 100) + '%';
        });
        queue.shift();
        sentCount++;
      }
    } catch (err) {
      setUploading(false);
      renderPreview();
      errorMsg.textContent = sentCount > 0
        ? 'Se enviaron ' + sentCount + ' foto(s), pero no se pudieron enviar las demás. Revisa tu conexión e inténtalo de nuevo.'
        : 'No se pudo enviar la foto. Revisa tu conexión e inténtalo de nuevo.';
      errorMsg.classList.add('active');
      return;
    }
    progressBar.style.width = '100%';
    progressText.textContent = '¡Listo!';
    thanksCopy.textContent = sentCount > 1
      ? 'Tus fotos ya son parte de nuestra historia.'
      : 'Tu foto ya es parte de nuestra historia.';
    setTimeout(() => {
      setUploading(false);
      progressBar.style.width = '0%';
      showScreen('thanks');
    }, 500);
  });
</script>
</body>
</html>
